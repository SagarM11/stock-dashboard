:root{--bg:#0b0e14;--line:#262e3d;--panel:#141a24;--panel2:#1b2230;--txt:#e6edf3;--mut:#8b97a8;--green:#2ecc71;--amber:#ffb74d;--red:#ff5c5c;--blue:#5b9dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0;padding:11px 14px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 12px;text-align:right;white-space:nowrap;font-size:12.5px}
th.l,td.l{text-align:left}th{color:var(--mut);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #161c28}.empty{padding:20px 14px;color:var(--mut)}
.chain{font-size:11px;padding:8px 14px;border-radius:8px;margin:10px 0}
.chain.ok{background:rgba(46,204,113,.08);color:var(--green);border:1px solid rgba(46,204,113,.25)}
.chain.bad{background:rgba(255,92,92,.1);color:var(--red);border:1px solid rgba(255,92,92,.35)}
.banner{background:rgba(255,183,77,.08);border:1px solid rgba(255,183,77,.3);color:var(--amber);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:12.5px}
@media(max-width:760px){.card .val{font-size:19px}th,td{padding:7px 8px}}
