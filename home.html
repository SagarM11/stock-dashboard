<!doctype html><html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Trading Desk</title><style>
:root{--bg:#0b0e14;--line:#262e3d;--panel:#141a24;--panel2:#1b2230;--txt:#e6edf3;--mut:#8b97a8;--green:#2ecc71;--amber:#ffb74d;--red:#ff5c5c;--blue:#5b9dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1{font-size:17px;margin:0}.wrap{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.card .val{font-size:22px;font-weight:800;margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--mut)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0;padding:11px 14px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 12px;text-align:right;white-space:nowrap;font-size:12.5px}
th.l,td.l{text-align:left}th{color:var(--mut);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #161c28}.empty{padding:20px 14px;color:var(--mut)}
.chain{font-size:11px;padding:8px 14px;border-radius:8px;margin:10px 0}
.chain.ok{background:rgba(46,204,113,.08);color:var(--green);border:1px solid rgba(46,204,113,.25)}
.chain.bad{background:rgba(255,92,92,.1);color:var(--red);border:1px solid rgba(255,92,92,.35)}
.banner{background:rgba(255,183,77,.08);border:1px solid rgba(255,183,77,.3);color:var(--amber);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:12.5px}
@media(max-width:760px){.card .val{font-size:19px}th,td{padding:7px 8px}}
</style></head><body><nav class="xnav" style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 14px;border-bottom:1px solid #262e3d;background:#0b0e14;align-items:center;"><a href="action.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">⚡&nbsp;Action</a><a href="home.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#7c5cff;color:#fff;border-color:#7c5cff;">🖥️&nbsp;Desk</a><a href="candidates.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">🎯&nbsp;Candidates</a><a href="cash.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">💵&nbsp;Cash EV</a><a href="index.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">📊&nbsp;Dashboard</a><a href="index_exec.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">📊&nbsp;Dash·Exec</a><a href="fno.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">⚡&nbsp;F&O</a><a href="options.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowr <div class="wrap">
<h1>🖥️ Trading Desk</h1>
<div id="root"></div>
</div>
<script>
const D={"m": {"strategy": "trend-capture-v2", "exit_mode": "trail", "n_closed": 17, "n_open": 9, "n_pending": 0, "account": 3000000, "closed_pnl": -190656, "win_pct": 5.9, "avg_win_R": 3.45, "avg_loss_R": -1.01, "expectancy_R": -0.749, "profit_factor": 0.21, "max_dd_pct": -6.2, "open_risk_pct": 4.49, "open_pnl": 238743, "equity": 3048087}, "chain_ok": true, "chain_msg": "chain intact (5275 events)", "opens": [{"symbol": "NAVINFLUOR", "entry": 7400.0, "stop": 7725.045364600019, "target": 8030.27, "qty": 47, "risk": 14812, "strategy": "trend-capture-v2", "signal_date": "2026-06-16", "id": "ed6c6eb0d6559bcf", "upnl": 54520, "R_now": 3.68, "entry_date": "2026-06-17"}, {"symbol": "PCBL", "entry": 305.95, "stop": 305.8544269656362, "target": 340.3, "qty": 873, "risk": 14989, "strategy": "trend-capture-v2", "signal_date": "2026-06-16", "id": "274ea8ce4e724a70", "upnl": 16238, "R_now": 1.08, "entry_date": "2026-06-17"}, {"symbol": "GOKEX", "entry": 777.95, "stop": 744.3963222928537, "target": 868.13, "qty": 332, "risk": 14970, "strategy": "trend-capture-v2", "signal_date": "2026-06-18", "id": "66fd3e9badfc352e", "upnl": -1693, "R_now": -0.11, "entry_date": "2026-06-19"}, {"symbol": "SUDEEPPHRM", "entry": 823.35, "stop": 995.5621914012693, "target": 934.01, "qty": 271, "risk": 14994, "strategy": "trend-capture-v2", "signal_date": "2026-06-25", "id": "fd448c815b99af08", "upnl": 82384, "R_now": 5.49, "entry_date": "2026-06-29"}, {"symbol": "METROPOLIS", "entry": 549.35, "stop": 519.39, "target": 609.26, "qty": 500, "risk": 14980, "strategy": "trend-capture-v2", "signal_date": "2026-07-08", "id": "2c922e7fbc98c102", "upnl": 21125, "R_now": 1.41, "entry_date": "2026-07-09"}, {"symbol": "THYROCARE", "entry": 573.6, "stop": 535.48, "target": 649.83, "qty": 393, "risk": 14981, "strategy": "trend-capture-v2", "signal_date": "2026-07-24", "id": "6f5a9e8e9080eeda", "upnl": 3419, "R_now": 0.23, "entry_date": "2026-07-27"}, {"symbol": "BLUESTONE", "entry": 793.0, "stop": 720.97, "target": 937.06, "qty": 208, "risk": 14982, "strategy": "trend-capture-v2", "signal_date": "2026-07-24", "id": "61661af18ea4f5fc", "upnl": 2070, "R_now": 0.14, "entry_date": "2026-07-27"}, {"symbol": "SAILIFE", "entry": 1315.9, "stop": 1320.776970077638, "target": 1427.21, "qty": 269, "risk": 14973, "strategy": "trend-capture-v2", "signal_date": "2026-07-29", "id": "d887e73d7c05ddb6", "upnl": 46026, "R_now": 3.07, "entry_date": "2026-07-30"}, {"symbol": "AETHER", "entry": 1580.0, "stop": 1488.16, "target": 1763.68, "qty": 163, "risk": 14970, "strategy": "trend-capture-v2", "signal_date": "2026-08-06", "id": "0d2cccdf73f32e46", "upnl": 14654, "R_now": 0.98, "entry_date": "2026-08-07"}], "pending": [], "generated": "2026-08-28 10:33"}, m=D.m;
const inr=v=>'₹'+Number(v||0).toLocaleString('en-IN');
const sign=v=>(v>0?'pos':v<0?'neg':'mut');
let h='';
h+=`<div class="chain ${D.chain_ok?'ok':'bad'}">${D.chain_ok?'🔒 Immutable log verified — ':'⚠ '}${D.chain_msg}. Updated ${D.generated}.</div>`;
// CAPITAL
h+='<div class="grid">';
h+=`<div class=card><div class=k>Equity</div><div class="val">${inr(m.equity)}</div></div>`;
h+=`<div class=card><div class=k>Closed P&L</div><div class="val ${sign(m.closed_pnl)}">${m.closed_pnl==null?'—':inr(m.closed_pnl)}</div></div>`;
h+=`<div class=card><div class=k>Open P&L</div><div class="val ${sign(m.open_pnl)}">${inr(m.open_pnl)}</div></div>`;
h+=`<div class=card><div class=k>Open risk</div><div class="val">${m.open_risk_pct}%</div></div>`;
h+=`<div class=card><div class=k>Max drawdown</div><div class="val ${sign(m.max_dd_pct)}">${m.max_dd_pct==null?'—':m.max_dd_pct+'%'}</div></div>`;
h+='</div>';
// STRATEGY HEALTH — the honest verdict
if(m.n_closed>0){
  h+='<div class="grid">';
  h+=`<div class=card><div class=k>Expectancy</div><div class="val ${sign(m.expectancy_R)}">${m.expectancy_R>0?'+':''}${m.expectancy_R}R</div></div>`;
  h+=`<div class=card><div class=k>Profit factor</div><div class="val ${m.profit_factor>=1?'pos':'neg'}">${m.profit_factor??'—'}</div></div>`;
  h+=`<div class=card><div class=k>Win rate</div><div class="val">${m.win_pct}%</div></div>`;
  h+=`<div class=card><div class=k>Closed trades</div><div class="val">${m.n_closed}</div></div>`;
  h+='</div>';
  if(m.n_closed<50 || D.opens.length){
    h+=`<div class="banner"><b>⚠ Not yet significant.</b> Only ${m.n_closed} trades have closed while ${D.opens.length} winners are still open. With a 5×ATR trailing stop, losers hit their stop in days but winners take months to trail out — so closed-only stats are <b>survivorship-biased toward early losers</b> right now (that's why expectancy looks deeply negative while open P&L is +${inr(m.open_pnl)}). These numbers only become meaningful after ~50–100 closed trades across a full cycle. Judge the strategy then, not now.</div>`;
  }
} else {
  h+=`<div class="banner"><b>No closed trades yet.</b> This desk shows only REAL forward-recorded results — it stays empty until paper trades fill and exit, and with a 5×ATR trailing stop + 180-session max hold, resolutions take months. Backtest context for <code>${m.strategy}</code>: the fixed-target v1 had <b>no edge</b> (PF≈1.0); this trailing v2 showed a <b>candidate edge</b> (PF 1.32, +0.24R on 3y) but concentrated in one regime (2024) — this forward log exists to confirm or refute it on live data before any capital is risked.</div>`;
}
// OPEN POSITIONS
h+='<div class=sec><h2>Manage open positions ('+D.opens.length+')</h2>';
if(D.opens.length){h+='<table><thead><tr><th class=l>Symbol</th><th class=l>Entry date</th><th>Entry</th><th>Trailing stop</th><th>Qty</th><th>Risk</th><th>uP&L</th><th>R now</th></tr></thead><tbody>';
 for(const t of D.opens)h+=`<tr><td class="l">${t.symbol}</td><td class="l mut">${t.entry_date}</td><td>${inr(t.entry)}</td><td>${inr(t.stop)}</td><td>${t.qty}</td><td>${inr(t.risk)}</td><td class="${sign(t.upnl)}">${inr(t.upnl)}</td><td class="${sign(t.R_now)}">${t.R_now>0?'+':''}${t.R_now}R</td></tr>`;
 h+='</tbody></table>';}else h+='<div class=empty>No open positions.</div>';
h+='</div>';
// PENDING FILLS
h+='<div class=sec><h2>Pending fills — next-session open ('+D.pending.length+')</h2>';
if(D.pending.length){h+='<table><thead><tr><th class=l>Symbol</th><th class=l>Signal date</th><th>Signal close</th><th class=l>Invalidation</th></tr></thead><tbody>';
 for(const t of D.pending)h+=`<tr><td class="l">${t.symbol}</td><td class="l mut">${t.signal_date}</td><td>${inr(t.signal_close)}</td><td class="l mut">${t.invalidation||''}</td></tr>`;
 h+='</tbody></table>';}else h+='<div class=empty>No pending signals.</div>';
h+='</div>';
document.getElementById('root').innerHTML=h;
</script></body></html>
