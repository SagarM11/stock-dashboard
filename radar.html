<!doctype html><html data-theme="dark"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="refresh" content="900"/><title>Momentum Radar · NSE</title>
<style>
:root{--bg:#0b0e14;--panel:#141925;--panel2:#1b2230;--line:#262e3d;--txt:#e6edf3;--mut:#8b97a8;
      --green:#2ecc71;--amber:#ffb74d;--red:#ff5c5c;--blue:#5b9dff;--accent:#7c5cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
     display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
.nav{display:flex;gap:8px;margin-left:auto}
.nav a{text-decoration:none}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--mut);font-size:13px;font-weight:600}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:hover{color:var(--txt)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);font-size:12px}
.note{padding:9px 20px;color:var(--amber);font-size:12px;border-bottom:1px solid var(--line);background:rgba(255,183,77,.07)}
.toolbar{padding:9px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 10px;font-size:12px;width:220px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 10px;font-size:12px}
.scrollhost{position:relative;flex:1 1 auto;min-height:0;display:flex;overflow:hidden}
.wrap{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wrap::-webkit-scrollbar{width:0;height:0}
@media (max-width:760px){
 header{padding:10px 12px;gap:8px;position:static}h1{font-size:15px}
 .nav{margin-left:0;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.tab{flex:0 0 auto}
 .toolbar{padding:8px 12px;gap:6px;overflow-x:auto;flex-wrap:nowrap}input{width:150px}
 th,td{padding:7px 8px;font-size:12px}.nm{max-width:120px}
 .vscroll{display:none}.wk{min-width:120px !important}
 .note{padding:8px 12px}
}
.vscroll{position:absolute;top:0;right:2px;bottom:16px;width:13px;background:#161c28;border-radius:7px;z-index:40}
.vthumb{position:absolute;left:1px;width:11px;background:#6b7a99;border-radius:6px;cursor:grab;min-height:32px}
.vthumb:hover{background:#8b9ac0}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);
   position:sticky;top:0;background:#10151f;cursor:pointer;user-select:none}
th:hover{color:var(--txt)}
td.l,th.l{text-align:left}
tbody tr:hover td{background:var(--panel2)}
td{border-bottom:1px solid #161c28}
.rank{color:var(--mut);width:34px}
.sym a{color:var(--txt);font-weight:700;text-decoration:none}
.sym a:hover{color:var(--blue);text-decoration:underline}
.nm{color:var(--mut);max-width:230px;overflow:hidden;text-overflow:ellipsis}
.ser{font-size:9px;font-weight:700;color:#1a1200;background:var(--amber);padding:1px 5px;border-radius:3px;margin-left:6px}
.bar{position:relative;display:inline-block;min-width:44px;text-align:right;font-weight:600}
.hot{color:var(--amber);font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--mut)}
.caret{display:inline-block;width:12px;color:var(--mut);font-size:10px}
.al{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.3px;cursor:help}
.al-ALIGNED{color:#08110a;background:var(--green)}
.al-DIVERGENT{color:#fff;background:#c0392b}
.al-NEUTRAL{color:#1a1200;background:var(--amber)}
th.f{position:sticky;top:27px;background:#0d1219;z-index:9;padding:3px 6px;border-bottom:1px solid var(--line)}
th.f input,th.f select{width:78px;padding:3px 5px;font-size:11px}
tr.clk{cursor:pointer}
tr.detail td{background:#0d1219;padding:0}
.why{padding:12px 18px 14px}
.verdict{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--txt);padding:6px 10px;background:var(--panel2);border-radius:7px;display:inline-block}
.wb{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #1a2030;text-align:left;white-space:normal}
.wk{color:var(--blue);font-weight:600;min-width:170px;flex-shrink:0;font-size:12px}
.wv{color:var(--txt);font-size:12.5px;line-height:1.5}
</style></head><body><nav class="xnav" style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 14px;border-bottom:1px solid #262e3d;background:#0b0e14;align-items:center;"><a href="home.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">🖥️&nbsp;Desk</a><a href="index.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">📊&nbsp;Dashboard</a><a href="fno.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">⚡&nbsp;F&O</a><a href="radar.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#7c5cff;color:#fff;border-color:#7c5cff;">🚀&nbsp;Radar</a><a href="ignitions.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">⚡&nbsp;Ignitions</a><a href="ipo.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">🆕&nbsp;IPO Monitor</a><a href="x_signals.html" style="text-decoration:none;flex:0 0 auto;border:1px solid #262e3d;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#8b97a8;background:#1b2230;">🐦&nbsp;X Signals</a></nav>
<header>
  <h1>🚀 Momentum Radar</h1>
  <span class="pill" id="cnt"></span>
  <span class="pill" id="uni"></span>
  <span class="pill" id="turn"></span>
  <span class="pill" id="gen"></span>
</header>
<div class="note">⚠ A <b>funnel, not a picker</b> — backtested: top names ~17.6% odds of a &gt;50% move in 90 days vs ~3% base.
Most won't fire; size small. <b>-BE / -BZ / -SM = surveillance / SME — high risk.</b> Not investment advice.</div>
<div class="toolbar">
  <input id="q" placeholder="Search symbol / name…" oninput="render()"/>
  <select id="serf" onchange="render()">
    <option value="">All series</option>
    <option value="EQ">EQ only (drop surveillance)</option>
    <option value="flagged">Flagged only (-BE/-SM)</option>
  </select>
  <span class="mut" id="shown"></span>
</div>
<div class="scrollhost"><div class="wrap"><div id="tbl"></div></div>
  <div class="vscroll"><div class="vthumb"></div></div></div>
<script>
const DATA={"generated": "2026-08-20 13:51", "universe": 62, "min_turnover_cr": 2.0, "candidates": []};
document.getElementById('cnt').textContent=DATA.candidates.length+' candidates';
document.getElementById('uni').textContent='universe '+DATA.universe;
document.getElementById('turn').textContent='turnover ≥ ₹'+DATA.min_turnover_cr+'cr';
document.getElementById('gen').textContent='generated '+DATA.generated;
const fmt=(v,d=1)=>v==null?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const ggrad=v=>`hsl(${Math.round(120*v/100)},60%,${28+v*0.18}%)`;
DATA.candidates.forEach((r,i)=>r._i=i+1);
const COLS=[
 ['symbol','Symbol','text',r=>`<span class="caret">${expanded.has(r.symbol)?'▾':'▸'}</span><span class="sym"><a href="https://www.tradingview.com/chart/?symbol=NSE:${r.symbol.split('-')[0]}" target="_blank" onclick="event.stopPropagation()">${r.symbol}</a></span>${r.series!=='EQ'?`<span class="ser">${r.series}</span>`:''}`],
 ['name','Name','text',r=>`<span class="nm" title="${r.name}">${r.name||'—'}</span>`],
 ['score','Radar','num',r=>`<span class="bar" style="color:${ggrad(r.score)}">${r.score}</span>`],
 ['rs_rank','RS','num',r=>`<span style="color:${ggrad(r.rs_rank)}">${r.rs_rank}</span>`],
 ['align','Align','text',r=>`<span class="al al-${r.align}" title="${r.align_reason||''}">${r.align==='ALIGNED'?'✓ ALIGNED':r.align==='DIVERGENT'?'✗ DIVERGE':'~ MIXED'}</span>`],
 ['pe','P/E','num',r=>r.pe!=null?fmt(r.pe,0):'<span class="mut">—</span>'],
 ['eps_g','EPS%','num',r=>r.eps_g!=null?`<span class="${r.eps_g>=0?'pos':'neg'}">${r.eps_g>=0?'+':''}${r.eps_g}</span>`:'<span class="mut">—</span>'],
 ['dist_high','Dist Hi%','num',r=>r.dist_high==null?'—':`<span class="${r.dist_high>=-3?'pos':''}">${fmt(r.dist_high)}</span>`],
 ['vol_ratio','Vol','num',r=>`<span class="${r.vol_ratio>2?'hot':''}">${fmt(r.vol_ratio,2)}</span>`],
 ['stage2','Stg2','text',r=>r.stage2?'<span class="pos">✓</span>':'<span class="mut">·</span>'],
 ['ltp','LTP','num',r=>fmt(r.ltp)],
 ['turnover_cr','Turn ₹cr','num',r=>fmt(r.turnover_cr)],
];
const _colf=r=>({}); // placeholder
const expanded=new Set();
function toggleRow(s){if(expanded.has(s))expanded.delete(s);else expanded.add(s);render();}
function whyPanel(r){
 const w=r.why;if(!w)return '';
 const b=w.bullets.map(x=>`<div class="wb"><span class="wk">${x[0]}</span><span class="wv">${x[1]}</span></div>`).join('');
 const alignline=`<div class="wb"><span class="wk">🔗 Fundamentals vs Technicals</span><span class="wv"><span class="al al-${r.align}">${r.align}</span> — ${r.align_reason||''}</span></div>`;
 return `<div class="why"><div class="verdict">${w.verdict}</div>${alignline}${b}</div>`;
}
function eps(r){return r.fund?r.fund.eps_g:null;}
let sk='score',sd=-1;
const colFilters={};
function numMatch(val,expr){if(val==null)return false;expr=expr.trim();
  if(expr.includes('..')){const[a,b]=expr.split('..').map(parseFloat);return val>=a&&val<=b;}
  const m=expr.match(/^(>=|<=|>|<|=)?\s*(-?\d+\.?\d*)$/);if(!m)return true;
  const op=m[1]||'>=',n=parseFloat(m[2]);
  return op==='>'?val>n:op==='<'?val<n:op==='<='?val<=n:op==='='?val===n:val>=n;}
function colMatch(r,k,t,expr){if(!expr)return true;
  if(t==='text')return String(r[k]||'').toLowerCase().includes(expr.toLowerCase());
  return numMatch(r[k],expr);}
function render(){
 const q=document.getElementById('q').value.toUpperCase();
 const sf=document.getElementById('serf').value;
 let rows=DATA.candidates.filter(r=>{
   if(q&&!(r.symbol.includes(q)||(r.name||'').toUpperCase().includes(q)))return false;
   if(sf==='EQ'&&r.series!=='EQ')return false;
   if(sf==='flagged'&&r.series==='EQ')return false;
   for(const[k,l,t]of COLS){if(!colMatch(r,k,t,colFilters[k]||''))return false;}
   return true;});
 rows.sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;
   return (typeof x==='string'?x.localeCompare(y):x-y)*sd;});
 document.getElementById('shown').textContent=rows.length+' shown';
 let h='<table><thead><tr>';
 COLS.forEach(([k,l,t])=>{h+=`<th class="${t==='text'?'l':''}" onclick="setSort('${k}')">${l}${sk===k?(sd<0?' ▾':' ▴'):''}</th>`});
 h+='</tr><tr>';
 COLS.forEach(([k,l,t])=>{const ph=t==='num'?'>0, 10..40':'text';
   h+=`<th class="f ${t==='text'?'l':''}"><input data-k="${k}" placeholder="${ph}" value="${colFilters[k]||''}" onclick="event.stopPropagation()" oninput="setColFilter('${k}',this.value)"/></th>`;});
 h+='</tr></thead><tbody>';
 for(const r of rows){
   h+=`<tr class="clk" onclick="toggleRow('${r.symbol}')">`;
   COLS.forEach(([k,l,t,f])=>{h+=`<td class="${t==='text'?'l':''}">${f(r)}</td>`});
   h+='</tr>';
   if(expanded.has(r.symbol))h+=`<tr class="detail"><td colspan="${COLS.length}">${whyPanel(r)}</td></tr>`;
 }
 document.getElementById('tbl').innerHTML=h+'</tbody></table>';
 syncBar();
}
function setSort(k){if(sk===k)sd*=-1;else{sk=k;sd=-1;}render();}
function setColFilter(k,v){colFilters[k]=v;render();
  const el=document.querySelector(`th.f input[data-k="${k}"]`);if(el){el.focus();el.setSelectionRange(v.length,v.length);}}
// custom scrollbar
const _w=document.querySelector('.wrap'),_vs=document.querySelector('.vscroll'),_vt=document.querySelector('.vthumb');
const _touch=window.matchMedia('(max-width:760px)').matches;
function syncBar(){if(_touch)return;if(_w.scrollHeight>_w.clientHeight+1){_vs.style.display='block';
  const trk=_vs.clientHeight,th=Math.max(32,trk*_w.clientHeight/_w.scrollHeight);_vt.style.height=th+'px';
  _vt.style.top=((trk-th)*_w.scrollTop/(_w.scrollHeight-_w.clientHeight))+'px';}else _vs.style.display='none';}
_w.addEventListener('scroll',syncBar);window.addEventListener('resize',syncBar);
let _d=null;_vt.addEventListener('mousedown',e=>{_d={y:e.clientY,top:_w.scrollTop};e.preventDefault();});
window.addEventListener('mousemove',e=>{if(_d){const trk=_vs.clientHeight,th=_vt.offsetHeight;
  _w.scrollTop=_d.top+(e.clientY-_d.y)*(_w.scrollHeight-_w.clientHeight)/(trk-th);}});
window.addEventListener('mouseup',()=>_d=null);
render();
</script></body></html>
